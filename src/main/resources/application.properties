spring.application.name=studyprogress
spring.profiles.default=local
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=900
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:studyprogress@localhost}
app.reminders.enabled=${REMINDERS_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} level=%p thread=%t logger=%logger{36} message=%msg%n
